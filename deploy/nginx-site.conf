# nginx-site.conf — the bare-metal FitTrainer site. This is the primary
# deployment path (see DEPLOY.md); deploy/nginx.conf is only for the container.
#
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/fittrainer
#   sudo ln -s /etc/nginx/sites-available/fittrainer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace fit.example.com with your domain everywhere it appears.
#
# ORDER MATTERS: the TLS block below points at certificate files that do not
# exist yet, and nginx -t fails on missing certificates. So get the certificate
# FIRST (DEPLOY.md does this with `certbot certonly --webroot`, using only the
# port 80 block), then install this file. Doing it the other way round leaves
# nginx refusing to start.
#
# ===== THE PASSWORD =====
# This app has no login screen and no accounts. The single Basic Auth password
# below is the only thing between the internet and your workout database, and it
# guards BOTH the app and /api. Create it with:
#
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd yourname      # prompts for a password
#
# Basic Auth sends that password on every request, so it is only safe over
# HTTPS. Do not open port 80 to anything but the certbot challenge.

# Cache-Control for the whole site, decided in one place. Doing it here rather
# than with add_header inside each location is deliberate: a location that
# declares its own add_header silently drops every add_header inherited from the
# server block, which would strip the security headers below from exactly the
# responses that need them most.
#
# "private" throughout — every response is behind a shared password, so no
# proxy or CDN should ever keep a copy.
map $uri $fittrainer_cache {
    # index.html, sw.js, manifest.webmanifest, SPA routes and all of /api.
    # Anything that decides *which* asset hashes to load must not be cached, or
    # a deploy leaves phones on the old bundle until their cache expires.
    default    "private, no-store";

    # Vite writes content-hashed filenames here, so these are safe forever.
    ~^/assets/ "private, max-age=31536000, immutable";

    # Self-hosted Inter/Outfit. Stable filenames; long max-age just avoids
    # refetching them.
    ~^/fonts/  "private, max-age=31536000, immutable";
}

# Rate limiting zones to prevent brute-force attacks on auth and API flood
limit_req_zone $binary_remote_addr zone=fittrainer_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=fittrainer_api:10m rate=30r/s;
limit_req_status 429;

# Redirect plain HTTP to HTTPS. The service worker and the PWA install prompt
# both require a secure origin, so http:// is only ever a stepping stone.
server {
    listen 80;
    listen [::]:80;
    server_name fit.example.com;

    # Leave this reachable without auth or TLS, or certbot renewals will fail.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        auth_basic off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` rather than the newer `http2 on;` because that
    # directive only exists in nginx 1.25.1+, and Debian 12 (1.22) and Ubuntu
    # 24.04 (1.24) would refuse to start. On 1.25+ this form still works, with
    # a deprecation warning you can silence by switching to `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fit.example.com;

    ssl_certificate     /etc/letsencrypt/live/fit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/fittrainer;
    index index.html;

    # ===== Auth, applied to the whole site =====
    # Declared at server level so every location below inherits it, /api
    # included. Exactly one location switches it off — the localhost-only health
    # probe — and it says so.
    auth_basic "FitTrainer";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Rate limiting on unauthenticated/login requests
    limit_req zone=fittrainer_auth burst=5 nodelay;

    # Don't advertise the nginx version in responses or error pages.
    server_tokens off;

    add_header Cache-Control $fittrainer_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API caps request bodies at 1 MB itself; this rejects anything larger
    # before it reaches Node.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # ===== The API =====
    # fittrainer-api binds 127.0.0.1:3001 only, so nginx is the single way in
    # and the password above cannot be sidestepped by hitting the port
    # directly. Keep it that way — do not bind the service to 0.0.0.0.
    #
    # No URI on proxy_pass, so the /api prefix is passed through untouched.
    # The server routes on it (it splits the path and expects seg[0] === 'api'),
    # so adding a trailing slash here would 404 everything.
    location /api/ {
        limit_req zone=fittrainer_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sync requests are small and frequent, and the client treats the
        # network as optional — failing fast beats hanging a phone.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_buffering off;
    }

    # Terminate HTTP Basic Auth session in browser
    location = /logout {
        auth_basic "FitTrainer Logout";
        auth_basic_user_file /dev/null;
        return 401 "<html><body><h1>Logged out</h1><p>Credentials cleared.</p><a href='/'>Sign in again</a></body></html>";
    }

    # Monitoring probe. `satisfy any` is the whole point of this block: the
    # request is allowed if EITHER it came from this machine OR it carried the
    # password. So a cron/systemd curl on the box needs no credentials, and the
    # app in a browser — which is already authenticated — can still use it as
    # its reachability check.
    #
    # Getting this wrong is not cosmetic. An earlier version ended in `deny all`
    # with `auth_basic off`, which 403s every request that is not from
    # localhost. The browser's isServerReachable() then always failed, so the
    # app believed the server was down while every other /api call succeeded,
    # and the sync indicator sat on "Offline" forever.
    location = /api/health {
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;

        access_log off;
    }

    # Static assets. Cache-Control comes from the map above; these blocks exist
    # only to keep the access log readable.
    location /assets/ { access_log off; }
    location /fonts/  { access_log off; }

    # SPA fallback. React Router owns the URL space, so an unknown path is a
    # client route rather than a 404. Must stay last.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
