# nginx config for the FitTrainer Docker image, used by deploy/docker-compose.yml.
#
# For a bare-metal install use deploy/nginx-site.conf instead — that file is the
# primary path in DEPLOY.md and includes server_name, TLS and the redirect from
# port 80. This one assumes something in front terminates TLS.
#
# The two configs differ in exactly one substantive way: the API upstream is the
# `api` service on the compose network here, and 127.0.0.1:3001 there.

# One place to decide caching; see the longer explanation in nginx-site.conf.
# Locations must not set their own add_header or they lose the inherited
# security headers.
map $uri $fittrainer_cache {
    default    "private, no-store";
    ~^/assets/ "private, max-age=31536000, immutable";
    ~^/fonts/  "private, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # The app has no login screen: this password is the only thing protecting
    # the workout database. docker-compose.yml mounts the file read-only.
    auth_basic "FitTrainer";
    auth_basic_user_file /etc/nginx/.htpasswd;

    server_tokens off;

    add_header Cache-Control $fittrainer_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Docker's embedded DNS. Needed because of the variable in proxy_pass
    # below, and short-lived so a restarted api container is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Going through a variable forces nginx to re-resolve `api` instead of
        # caching the container IP at startup, which is what otherwise turns an
        # `api` restart into permanent 502s. $request_uri is spelled out
        # because a proxy_pass containing variables no longer passes the
        # original URI on its own — and the server routes on the /api prefix.
        set $fittrainer_api http://api:3001;
        proxy_pass $fittrainer_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_buffering off;
    }

    # For the container HEALTHCHECK, which cannot send the password. Answered by
    # nginx itself, so it says nothing about whether the API is up — that is
    # what the api service's own healthcheck is for.
    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location /assets/ { access_log off; }
    location /fonts/  { access_log off; }

    # SPA fallback: React Router owns the routes. Must stay last.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
